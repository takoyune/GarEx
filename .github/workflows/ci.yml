name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build bridge on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File tools/build_upstream.ps1
          powershell -ExecutionPolicy Bypass -File tools/build_bridge.ps1

      - name: Run Windows full test suite
        if: runner.os == 'Windows'
        run: |
          python -m pytest tests/ -v

      - name: Run Linux native test suite
        if: runner.os == 'Linux'
        run: |
          python -m pytest tests/unit/ tests/integration/test_native_*.py tests/integration/test_roundtrip.py -v -m "not bridge"
