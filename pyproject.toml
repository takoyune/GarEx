[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garex"
version = "0.1.1"
description = "Modern visual novel resource management library and CLI — continuing the legacy of GARbro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TakoYune" }
]
urls = { Homepage = "https://github.com/TakoYune/GarEx", Repository = "https://github.com/TakoYune/GarEx" }
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
garex = "garex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "bridge: marks tests as requiring real bridge .NET assemblies",
]
