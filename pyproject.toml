# Owner decisions: name=garex, Windows first, Python>=3.10, license MIT (confirm via ADR).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garex"
version = "0.1.0"
description = "Python library for browsing, extracting, converting and repacking visual novel game resources (port of GARbro)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
garex = "garex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garex"]

[tool.hatch.build.targets.wheel.force-include]
"src/garex/_bridge" = "garex/_bridge"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "bridge: marks tests as requiring real bridge .NET assemblies",
]
